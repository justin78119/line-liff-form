<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民宿會員登記表單</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">民宿會員登記</h2>
        
        <div id="loading" class="text-center py-8 text-slate-500">
            <p class="animate-pulse">正在載入 LINE 安全模組...</p>
        </div>

        <form id="liffForm" class="hidden space-y-4">
            <input type="hidden" id="userId" name="userId">
            <input type="hidden" id="displayName" name="displayName">

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">LINE 帳號</label>
                <div id="userProfileName" class="w-full px-4 py-2 rounded-lg bg-slate-50 border border-slate-200 text-slate-500 font-medium">
                    載入中...
                </div>
            </div>

            <div>
                <label for="hotelName" class="block text-sm font-medium text-slate-700 mb-1">民宿名稱 <span class="text-red-500">*</span></label>
                <input type="text" id="hotelName" name="hotelName" required
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" 
                    placeholder="請輸入您的民宿名稱">
            </div>

            <div>
                <label for="contactName" class="block text-sm font-medium text-slate-700 mb-1">聯繫人姓名 <span class="text-red-500">*</span></label>
                <input type="text" id="contactName" name="contactName" required
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" 
                    placeholder="請輸入聯繫人姓名">
            </div>

            <div>
                <label for="contactPhone" class="block text-sm font-medium text-slate-700 mb-1">聯繫電話號碼 <span class="text-red-500">*</span></label>
                <input type="tel" id="contactPhone" name="contactPhone" required
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" 
                    placeholder="例如：0912345678">
            </div>

            <div>
                <label for="city" class="block text-sm font-medium text-slate-700 mb-1">所在城市 <span class="text-red-500">*</span></label>
                <select id="city" name="city" required
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    <option value="" disabled selected>請選擇所在縣市</option>
                    <option value="基隆市">基隆市</option>
                    <option value="台北市">台北市</option>
                    <option value="新北市">新北市</option>
                    <option value="桃園市">桃園市</option>
                    <option value="新竹市">新竹市</option>
                    <option value="新竹縣">新竹縣</option>
                    <option value="苗栗縣">苗栗縣</option>
                    <option value="台中市">台中市</option>
                    <option value="彰化縣">彰化縣</option>
                    <option value="南投縣">南投縣</option>
                    <option value="雲林縣">雲林縣</option>
                    <option value="嘉義市">嘉義市</option>
                    <option value="嘉義縣">嘉義縣</option>
                    <option value="台南市">台南市</option>
                    <option value="高雄市">高雄市</option>
                    <option value="屏東縣">屏東縣</option>
                    <option value="宜蘭縣">宜蘭縣</option>
                    <option value="花蓮縣">花蓮縣</option>
                    <option value="台東縣">台東縣</option>
                    <option value="澎湖縣">澎湖縣</option>
                    <option value="金門縣">金門縣</option>
                    <option value="連江縣">連江縣</option>
                </select>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 bg-emerald-500 text-white font-semibold rounded-lg hover:bg-emerald-600 transition duration-200 shadow-md">
                確認送出
            </button>
        </form>
    </div>

    <script>
        // 🚨 填入你的 LINE LIFF ID
        const MY_LIFF_ID = '2009896064-IACIgobo'; 
        
        // 🚨 填入步驟一複製的 GAS Web App URL
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwaLCp-ReThfboahNVg3qttJ2ptxyLBAxAE-6Kgchgyrll_apr_EnoSn4X88-rb2S4k6A/exec'; 

        async function initializeLiff() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById('userId').value = profile.userId;
                    document.getElementById('displayName').value = profile.displayName;
                    document.getElementById('userProfileName').innerText = profile.displayName;
                    
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('liffForm').classList.remove('hidden');
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error('LIFF 初始化失敗：', error);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold">安全模組載入失敗，請從 LINE 重新開啟</p>`;
            }
        }

        document.getElementById('liffForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '正在送出資料...';

            const formData = {
                userId: document.getElementById('userId').value,
                displayName: document.getElementById('displayName').value,
                hotelName: document.getElementById('hotelName').value,
                contactName: document.getElementById('contactName').value,
                contactPhone: document.getElementById('contactPhone').value,
                city: document.getElementById('city').value
            };

            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                alert('登記成功！感謝您的填寫。');
                liff.closeWindow();
            } catch (error) {
                console.error('送出失敗：', error);
                alert('系統忙碌中，請稍後再試！');
                submitBtn.disabled = false;
                submitBtn.innerText = '確認送出';
            }
        });

        window.onload = initializeLiff;
    </script>
</body>
</html>
