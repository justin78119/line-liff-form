<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民宿會員資料登記</title>
    
    <script src="https://static.liff.line.me/js/v2/sdk.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
        .form-container { max-width: 400px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="tel"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input:required, select:required { border-left: 4px solid #e74c3c; }
        button { width: 100%; padding: 12px; background-color: #2ecc71; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .loading { text-align: center; color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>民宿會員資料登記</h2>
    <div id="loading" class="loading">正在載入 LINE 使用者資訊...</div>
    
    <form id="infoForm" style="display: none;" onsubmit="submitForm(event)">
        <input type="hidden" id="userId" name="userId">

        <div class="form-group">
            <label for="hotelName">民宿名稱 <span style="color:red;">*</span></label>
            <input type="text" id="hotelName" name="hotelName" placeholder="請輸入您的民宿全名" required>
        </div>

        <div class="form-group">
            <label for="city">所在城市 <span style="color:red;">*</span></label>
            <select id="city" name="city" required>
                <option value="" disabled selected>-- 請選擇縣市 --</option>
                <option value="基隆市">基隆市</option>
                <option value="臺北市">臺北市</option>
                <option value="新北市">新北市</option>
                <option value="桃園市">桃園市</option>
                <option value="新竹市">新竹市</option>
                <option value="新竹縣">新竹縣</option>
                <option value="苗栗縣">苗栗縣</option>
                <option value="臺中市">臺中市</option>
                <option value="彰化縣">彰化縣</option>
                <option value="南投縣">南投縣</option>
                <option value="雲林縣">雲林縣</option>
                <option value="嘉義市">嘉義市</option>
                <option value="嘉義縣">嘉義縣</option>
                <option value="臺南市">臺南市</option>
                <option value="高雄市">高雄市</option>
                <option value="屏東縣">屏東縣</option>
                <option value="宜蘭縣">宜蘭縣</option>
                <option value="花蓮縣">花蓮縣</option>
                <option value="臺東縣">臺東縣</option>
                <option value="澎湖縣">澎湖縣</option>
                <option value="金門縣">金門縣</option>
                <option value="連江縣">連江县</option>
            </select>
        </div>

        <div class="form-group">
            <label for="contactName">聯繫人姓名 <span style="color:red;">*</span></label>
            <input type="text" id="contactName" name="contactName" placeholder="請輸入聯絡人姓名" required>
        </div>

        <div class="form-group">
            <label for="contactPhone">聯繫電話號碼 <span style="color:red;">*</span></label>
            <input type="tel" id="contactPhone" name="contactPhone" placeholder="例如：0912345678" pattern="[0-9]{9,10}" title="請輸入正確的電話號碼數字" required>
        </div>

        <button type="submit">確認提交</button>
    </form>
</div>

<script>
    // 初始化 LIFF 函式
    async function initLIFF() {
        // 2. 防呆機制：檢查 window.liff 是否存在
        if (typeof liff === 'undefined') {
            alert('錯誤：LINE SDK 未能成功載入，請確認網路連線或嘗試重新開啟 LINE。');
            return;
        }

        try {
            await liff.init({ liffId: '2009896064-IACIgobo' }); 
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById('userId').value = profile.userId; 
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('infoForm').style.display = 'block';
            }
        } catch (error) {
            console.error('LIFF 初始化失敗', error);
            alert('LIFF 初始化失敗原因：' + error.code + ' - ' + error.message + '\n完整資訊: ' + JSON.stringify(error));
        }
    }

    // 表單提交事件
    async function submitForm(event) {
        event.preventDefault(); 
        
        const userId = document.getElementById('userId').value;
        const hotelName = document.getElementById('hotelName').value;
        const city = document.getElementById('city').value;
        const contactName = document.getElementById('contactName').value;
        const contactPhone = document.getElementById('contactPhone').value;

        if (!userId) {
            alert('未能成功取得 LINE 身分驗證，無法提交！');
            return;
        }

        // ⚠️ 請務必改為你最新部署成功、結尾是 /exec 的 GAS 網址！
        const gasWebhookUrl = 'https://script.google.com/macros/s/AKfycbwaLCp-ReThfboahNVg3qttJ2ptxyLBAxAE-6Kgchgyrll_apr_EnoSn4X88-rb2S4k6A/exec'; 

        try {
            const response = await fetch(gasWebhookUrl, {
                method: 'POST',
                mode: 'no-cors', 
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: userId,
                    hotelName: hotelName,
                    city: city,
                    contactName: contactName,
                    contactPhone: contactPhone
                })
            });

            alert('資料提交成功！感謝您的登記。');
            liff.closeWindow(); 
        } catch (error) {
            console.error('提交錯誤', error);
            alert('提交失敗，請檢查網路連線後再試一次。');
        }
    }

    // 3. 確保網頁所有元件（包括外部 SDK 腳本）完全下載完畢才執行初始化
    window.addEventListener('load', initLIFF);
</script>

</body>
</html>
